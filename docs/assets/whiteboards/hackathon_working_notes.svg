<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Hackathon working notes placeholder</title>
  <desc id="desc">A simple editable placeholder for a question, intended output, evidence, and next check.</desc>
  <rect width="1200" height="675" rx="24" fill="#f5f7f3"/>
  <rect x="48" y="48" width="1104" height="579" rx="18" fill="#ffffff" stroke="#244f3a" stroke-width="4"/>
  <text x="92" y="120" fill="#244f3a" font-family="Arial, sans-serif" font-size="44" font-weight="700">Hackathon working notes</text>
  <text x="92" y="164" fill="#50665a" font-family="Arial, sans-serif" font-size="24">Replace this placeholder with a photo, sketch, screenshot, or diagram.</text>
  <g font-family="Arial, sans-serif" font-size="28" fill="#173126">
    <rect x="92" y="212" width="472" height="142" rx="12" fill="#e7f0eb"/>
    <text x="120" y="260" font-weight="700">Question</text>
    <text x="120" y="307" font-size="22">What are we trying to understand or enable?</text>
    <rect x="636" y="212" width="472" height="142" rx="12" fill="#e7f0eb"/>
    <text x="664" y="260" font-weight="700">Useful output</text>
    <text x="664" y="307" font-size="22">What can this team make in 1.5 days?</text>
    <rect x="92" y="390" width="472" height="142" rx="12" fill="#eef4e0"/>
    <text x="120" y="438" font-weight="700">Evidence</text>
    <text x="120" y="485" font-size="22">What data, test, or observation supports it?</text>
    <rect x="636" y="390" width="472" height="142" rx="12" fill="#eef4e0"/>
    <text x="664" y="438" font-weight="700">Next check</text>
    <text x="664" y="485" font-size="22">What must be finished or validated next?</text>
  </g>
</svg>
